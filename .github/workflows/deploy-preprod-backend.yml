name: Deploy preprod backend

on:
  push:
    branches:
      - backend-preprod

concurrency:
  group: preprod-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync backend to VPS preprod
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_KEY }}
        run: |
          set -eu
          test -n "${SSH_PRIVATE_KEY:-}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 54.37.231.243 >> ~/.ssh/known_hosts
          rsync -az --delete \
            --filter 'P .env' \
            --filter 'P .env.*' \
            --filter 'P node_modules/' \
            --filter 'P uploads/' \
            --filter 'P coverage/' \
            --filter 'P .tmp/' \
            --filter 'P testAudio/' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'uploads/' \
            --exclude 'coverage/' \
            --exclude '.tmp/' \
            --exclude 'testAudio/' \
            ./ deploy@54.37.231.243:/home/deploy/apps/mysmartfood-preprod/backend/
          ssh deploy@54.37.231.243 \
            '/home/deploy/apps/mysmartfood-preprod/backend/scripts/deploy-preprod-on-vps.sh'
