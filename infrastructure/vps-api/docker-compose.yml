# VPS MySmartFood dedie uniquement (API + Postgres).
# Interdit sur le VPS Mafrashop (nginx hote + PM2 occupe deja 80/443).
# Sur ce VPS partage : infrastructure/vps-nginx/ (vhosts nginx, pas Caddy).
# Postgres n'ecoute que le reseau Docker interne.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysmartfood}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-mysmartfood_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER:-mysmartfood_owner} -d ${POSTGRES_DB:-mysmartfood}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-preprod}
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_OWNER: ${DATABASE_URL_OWNER}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - public
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/ping').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/vps-api/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_APP_URL: ${VITE_APP_URL:-/app}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
    expose:
      - "80"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}
      SITE_APEX: ${SITE_APEX:-mysmartfood.fr}
      SITE_WWW: ${SITE_WWW:-www.mysmartfood.fr}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-dashboard.mysmartfood.fr}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

networks:
  internal:
    internal: true
  public:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
