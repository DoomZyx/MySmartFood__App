# A copier vers /etc/nginx/snippets/mysmartfood-spa-preprod.conf
# Preprod isolee. Ne PAS include snippets/mysmartfood-spa.conf
# (prod : PM2 mysmartfood, 127.0.0.1:8080, dist /home/deploy/apps/mysmartfood/frontend/dist).
# Fastify = PM2 mysmartfood-preprod sur 127.0.0.1:8081.
# SPA = /home/deploy/apps/mysmartfood-preprod/frontend/dist
# Ne pas utiliser Caddy Docker sur ce VPS : nginx hote occupe deja 80/443 (Mafrashop).
#
# Checklist VPS (deploy@54.37.231.243), ne pas SSH depuis ce depot :
#   sudo cp snippets/mysmartfood-spa-preprod.conf /etc/nginx/snippets/mysmartfood-spa-preprod.conf
#   sudo ln -s /etc/nginx/sites-available/preprod.mysmartfood.fr /etc/nginx/sites-enabled/
#   sudo ln -s /etc/nginx/sites-available/preprod.api.mysmartfood.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d preprod.mysmartfood.fr -d preprod.api.mysmartfood.fr
#   pm2 start /home/deploy/apps/mysmartfood-preprod/infrastructure/ecosystem-mysmartfood-preprod.cjs
#   pm2 save
# COOKIE_DOMAIN : host-only (vide). Jamais .mysmartfood.fr (melange sessions prod/preprod).

root /home/deploy/apps/mysmartfood-preprod/frontend/dist;
index index.html;
client_max_body_size 64m;

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /api/ws/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_buffering off;
}

location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /twilio/ {
    proxy_pass http://127.0.0.1:8081;
