# A copier vers /etc/nginx/sites-available/preprod.api.mysmartfood.fr
# API + SPA preprod (equivalent app.api.mysmartfood.fr). Fastify 127.0.0.1:8081.
# Ne PAS include snippets/mysmartfood-spa.conf (prod 8080).
# Ne pas toucher le vhost prod app.api.mysmartfood.fr ni Mafrashop.
#
# Checklist VPS (deploy@54.37.231.243) :
#   sudo cp infrastructure/vps-nginx/snippets/mysmartfood-spa-preprod.conf \
#     /etc/nginx/snippets/mysmartfood-spa-preprod.conf
#   sudo cp infrastructure/vps-nginx/sites-available/mysmartfood-preprod.api.conf \
#     /etc/nginx/sites-available/preprod.api.mysmartfood.fr
#   sudo ln -s /etc/nginx/sites-available/preprod.api.mysmartfood.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d preprod.api.mysmartfood.fr
#   pm2 start /home/deploy/apps/mysmartfood-preprod/infrastructure/ecosystem-mysmartfood-preprod.cjs
#   pm2 save
# COOKIE_DOMAIN host-only (vide). .preprod.mysmartfood.fr ne couvre PAS preprod.api.
# Jamais COOKIE_DOMAIN=.mysmartfood.fr (melange sessions prod/preprod).

server {
    listen 80;
    listen [::]:80;
    server_name preprod.api.mysmartfood.fr;
    include snippets/mysmartfood-spa-preprod.conf;
}
