# Reference pour /etc/nginx/sites-available/app.api.mysmartfood.fr
# API + webhooks uniquement. La SPA se sert sur www (vitrine) et /app (application).
# TLS : certbot --nginx -d app.api.mysmartfood.fr

server {
    listen 80;
    listen [::]:80;
    server_name app.api.mysmartfood.fr;
    client_max_body_size 64m;
    include snippets/mysmartfood-api.conf;
}
