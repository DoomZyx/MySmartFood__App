# Reference pour /etc/nginx/sites-available/app.api.mysmartfood.fr
# Si le vhost existe deja, ne pas le dupliquer : verifier seulement root + proxy 127.0.0.1:8080.
# TLS : certbot --nginx -d app.api.mysmartfood.fr

server {
    listen 80;
    listen [::]:80;
    server_name app.api.mysmartfood.fr;
    client_max_body_size 64m;
    include snippets/mysmartfood-spa.conf;
}
