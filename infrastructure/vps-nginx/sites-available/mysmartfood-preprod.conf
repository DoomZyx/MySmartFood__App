# A copier vers /etc/nginx/sites-available/preprod.mysmartfood.fr
# Vitrine preprod. Ne pas ecraser les vhosts Mafrashop ni mysmartfood-www (prod).
# Ne PAS include snippets/mysmartfood-spa.conf (prod 8080).
#
# Checklist VPS (deploy@54.37.231.243) :
#   sudo cp infrastructure/vps-nginx/snippets/mysmartfood-spa-preprod.conf \
#     /etc/nginx/snippets/mysmartfood-spa-preprod.conf
#   sudo cp infrastructure/vps-nginx/sites-available/mysmartfood-preprod.conf \
#     /etc/nginx/sites-available/preprod.mysmartfood.fr
#   sudo ln -s /etc/nginx/sites-available/preprod.mysmartfood.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d preprod.mysmartfood.fr
#   pm2 start /home/deploy/apps/mysmartfood-preprod/infrastructure/ecosystem-mysmartfood-preprod.cjs
#   pm2 save
# COOKIE_DOMAIN host-only (vide) ou .preprod.mysmartfood.fr — jamais .mysmartfood.fr.

server {
    listen 80;
    listen [::]:80;
    server_name preprod.mysmartfood.fr;
    client_max_body_size 64m;
    include snippets/mysmartfood-spa-preprod.conf;
}
