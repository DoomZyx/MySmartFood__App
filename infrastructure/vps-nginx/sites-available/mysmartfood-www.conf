# A copier vers /etc/nginx/sites-available/mysmartfood-www
# Vitrine hors Vercel. Ne pas ecraser les vhosts Mafrashop (prod / preprod).
# TLS : certbot --nginx -d mysmartfood.fr -d www.mysmartfood.fr -d dashboard.mysmartfood.fr

server {
    listen 80;
    listen [::]:80;
    server_name mysmartfood.fr;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://www.mysmartfood.fr$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mysmartfood.fr;
    include snippets/mysmartfood-spa.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.mysmartfood.fr;
    include snippets/mysmartfood-spa.conf;
}
